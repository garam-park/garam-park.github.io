<!--
  댓글: giscus (GitHub Discussions 기반).
  설정값은 _config.yml 의 `giscus:` 키에서 채운다. 값이 비어 있으면 아무것도 렌더링하지 않는다.
  값은 https://giscus.app 에서 repo·category 선택 후 발급받는다.
-->
{% if site.giscus.repo and site.giscus.repo_id and site.giscus.category_id %}
<section class="comments">
  <script src="https://giscus.app/client.js"
    data-repo="{{ site.giscus.repo }}"
    data-repo-id="{{ site.giscus.repo_id }}"
    data-category="{{ site.giscus.category }}"
    data-category-id="{{ site.giscus.category_id }}"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="preferred_color_scheme"
    data-lang="ko"
    crossorigin="anonymous"
    async>
  </script>
</section>
{% endif %}
