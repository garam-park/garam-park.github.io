interface:
  display_name: "Notion 할 일 명세 분석"
  short_description: "정확한 작업 ID 한 건의 요구사항과 저장소 영향을 읽기 전용 분석"
  default_prompt: "Use $notion-analyze-task with 작업 ID: <ID> to analyze one StoryG Blog task for specification."

dependencies:
