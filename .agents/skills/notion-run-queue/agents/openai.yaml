interface:
  display_name: "Notion 자동 작업 큐"
  short_description: "StoryG Blog 작업을 선택부터 사람 검토 요청까지 반복 처리"
  default_prompt: "Use $notion-run-queue to process eligible StoryG Blog tasks until the actionable queue is empty."

dependencies:
  tools:
    - type: "mcp"
      value: "notion"
      description: "Project-local Notion MCP for the StoryG Blog task lifecycle"
    - type: "mcp"
      value: "github"
      description: "GitHub access for branches, pull requests, reviews, and CI"
