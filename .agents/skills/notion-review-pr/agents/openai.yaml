interface:
  display_name: "Notion PR 멀티 리뷰"
  short_description: "독립 리뷰와 수정 루프를 반복해 PR을 승인 가능 상태로 준비"
  default_prompt: "Use $notion-review-pr with 작업 ID: <ID> and PR: <number-or-URL> to review and fix it until every approval condition passes."

dependencies:
  tools:
    - type: "mcp"
      value: "notion"
      description: "Project-local Notion MCP for task specifications and post gates"
    - type: "mcp"
      value: "github"
      description: "GitHub access for pull request diffs, checks, and review context"
