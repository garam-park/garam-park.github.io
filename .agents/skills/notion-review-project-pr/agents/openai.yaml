interface:
  display_name: "Notion 프로젝트 PR 리뷰"
  short_description: "확정 명세와 포스트 검색 Gate 기준으로 PR 구현 품질 검토"
  default_prompt: "Use $notion-review-project-pr to review a StoryG Blog pull request against its approved Notion specification."

dependencies:
  tools:
    - type: "mcp"
      value: "notion"
      description: "Project-local Notion MCP for task specifications and post gates"
    - type: "mcp"
      value: "github"
      description: "GitHub access for pull request diffs, checks, and review context"
